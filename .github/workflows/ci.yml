name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  DATABASE_URL: postgres://ironledger:ironledger@localhost:5432/ironledger

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ironledger
          POSTGRES_PASSWORD: ironledger
          POSTGRES_DB: ironledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ironledger"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.85.1
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libssl-dev protobuf-compiler

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Event bus without Kafka
        run: cargo clippy -p ironledger-event-bus --all-targets --no-default-features -- -D warnings

      - name: Unit and integration tests
        run: cargo test --workspace

      - name: PostgreSQL smoke (idempotent deposit)
        run: cargo test -p ironledger-integration-tests --test postgres_smoke -- --ignored --nocapture

      - name: Release build
        run: cargo build --workspace --release

      - name: Docs
        run: cargo doc --workspace --no-deps

      - name: Docker Compose config
        run: docker compose config

      - name: Install cargo-audit and cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny

      - name: Dependency audit
        run: cargo audit

      - name: License and ban policy
        run: cargo deny check
