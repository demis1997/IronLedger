[package]
name = "ironledger-benches"
description = "Criterion benchmarks for domain validation, journal construction, event serde and projection"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
ironledger-domain = { workspace = true }
ironledger-ledger = { workspace = true, features = ["memory"] }
ironledger-projector = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "domain_validation"
harness = false

[[bench]]
name = "journal_construction"
harness = false

[[bench]]
name = "event_serde"
harness = false

[[bench]]
name = "projection"
harness = false
