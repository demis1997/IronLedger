[package]
name = "ironledger-projector-service"
description = "Consumes ledger events and maintains projected balances"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "projector-service"
path = "src/main.rs"

[dependencies]
ironledger-api-http = { workspace = true }
ironledger-domain = { workspace = true }
ironledger-event-bus = { workspace = true }
ironledger-ledger = { workspace = true }
ironledger-projector = { workspace = true }
ironledger-storage-postgres = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[features]
default = ["kafka"]
kafka = ["ironledger-event-bus/kafka"]
